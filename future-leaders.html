<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Leaders — Elitez Group</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f3;}
.app{max-width:860px;margin:0 auto;padding:1.5rem 1rem;}
.hidden{display:none!important;}
.tabs{display:flex;gap:2px;border-bottom:1px solid #e5e5e5;margin-bottom:1.5rem;flex-wrap:wrap;}
.tab{padding:8px 13px;font-size:13px;cursor:pointer;border:none;background:none;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;white-space:nowrap;}
.tab.active{color:#1a1a1a;border-bottom-color:#7F77DD;font-weight:500;}
.tab:hover:not(.active){color:#1a1a1a;background:#f0f0f0;border-radius:4px 4px 0 0;}
.sec{display:none;}.sec.active{display:block;}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px;}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:1.2rem;}
.metric{background:#f5f5f3;border-radius:8px;padding:10px 12px;}
.metric .ml{font-size:11px;color:#888;margin-bottom:3px;}
.metric .mv{font-size:20px;font-weight:500;}
.badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;display:inline-block;}
.b-new{background:#E6F1FB;color:#185FA5;}
.b-screened{background:#FAEEDA;color:#854F0B;}
.b-interview{background:#EEEDFE;color:#534AB7;}
.b-pending{background:#FAEEDA;color:#854F0B;}
.b-approved{background:#EAF3DE;color:#3B6D11;}
.b-rejected{background:#FCEBEB;color:#A32D2D;}
.b-onboarded{background:#E1F5EE;color:#0F6E56;}
.b-active{background:#EAF3DE;color:#3B6D11;}
.b-completed{background:#E1F5EE;color:#0F6E56;}
.b-converted{background:#EEEDFE;color:#534AB7;}
.btn{padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid #d0d0d0;background:#fff;color:#1a1a1a;font-family:inherit;}
.btn:hover{background:#f5f5f3;}
.btn-primary{background:#7F77DD;color:#fff;border-color:#7F77DD;}
.btn-primary:hover{background:#534AB7;}
.btn-approve{background:#EAF3DE;color:#3B6D11;border-color:#3B6D11;}
.btn-approve:hover{background:#C0DD97;}
.btn-reject{background:#FCEBEB;color:#A32D2D;border-color:#A32D2D;}
.btn-reject:hover{background:#F7C1C1;}
.btn-sm{padding:4px 10px;font-size:12px;}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;}
.row:last-child{border-bottom:none;}
.row:hover{background:#f9f9f9;margin:0 -12px;padding:9px 12px;border-radius:8px;}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:12px;flex-shrink:0;}
.av0{background:#EEEDFE;color:#534AB7;}.av1{background:#E1F5EE;color:#0F6E56;}.av2{background:#FAECE7;color:#993C1D;}.av3{background:#E6F1FB;color:#185FA5;}.av4{background:#FBEAF0;color:#993556;}
.ri{flex:1;min-width:0;}
.rn{font-weight:500;font-size:13px;}
.rs{font-size:11px;color:#888;}
.pbar{height:4px;background:#f0f0f0;border-radius:2px;overflow:hidden;margin-top:3px;}
.pfill{height:100%;border-radius:2px;}
.fg{display:flex;flex-direction:column;gap:3px;}
.fg.full{grid-column:1/-1;}
.fg label{font-size:11px;color:#888;}
.fg input,.fg select,.fg textarea{padding:7px 10px;border:1px solid #d0d0d0;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:#1a1a1a;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:#7F77DD;}
.fg textarea{resize:vertical;min-height:60px;}
.back{cursor:pointer;color:#534AB7;font-size:13px;margin-bottom:1rem;display:inline-flex;align-items:center;gap:4px;}
.back:hover{text-decoration:underline;}
.sdiv{font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin:12px 0 6px;}
.ai-box{background:#EEEDFE;border:1px solid #AFA9EC;border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.ai-lbl{font-size:10px;font-weight:600;color:#534AB7;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.vscores{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.vs{background:#fff;border-radius:8px;padding:7px 9px;}
.vs-n{font-size:10px;color:#888;text-transform:capitalize;margin-bottom:2px;}
.vs-v{font-size:16px;font-weight:500;color:#534AB7;}
.vs-b{height:3px;background:#CECBF6;border-radius:2px;margin-top:3px;overflow:hidden;}
.vs-f{height:100%;background:#7F77DD;border-radius:2px;}
.upload-zone{border:2px dashed #d0d0d0;border-radius:12px;padding:1.5rem;text-align:center;cursor:pointer;margin-bottom:1rem;transition:background 0.15s;}
.upload-zone:hover{background:#f9f9f9;}
.spinner{width:20px;height:20px;border:2px solid #CECBF6;border-top-color:#7F77DD;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 8px;}
@keyframes spin{to{transform:rotate(360deg);}}
.stars{color:#EF9F27;font-size:14px;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem;}
.modal{background:#fff;border-radius:12px;border:1px solid #e5e5e5;padding:1.5rem;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:600;margin-bottom:1rem;}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem;}
.pipe-flow{display:flex;gap:0;margin-bottom:1rem;overflow-x:auto;background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:12px;}
.ps{flex:1;min-width:70px;text-align:center;padding:6px 4px;}
.ps-n{font-size:18px;font-weight:600;}
.ps-l{font-size:10px;color:#888;}
.pa{display:flex;align-items:center;color:#ccc;font-size:14px;padding-top:6px;}
.approve-block{background:#EEEDFE;border:1px solid #AFA9EC;border-radius:12px;padding:12px 14px;margin-top:10px;}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;}
.dl{color:#888;}.dv{font-weight:500;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.login-screen{min-height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;}
.login-logo{width:56px;height:56px;background:#EEEDFE;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:1.5rem;}
.login-title{font-size:22px;font-weight:600;margin-bottom:4px;text-align:center;}
.login-sub{font-size:13px;color:#888;margin-bottom:2rem;text-align:center;}
.role-cards{display:grid;grid-template-columns:1fr;gap:10px;width:100%;max-width:400px;}
.role-card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:border-color 0.15s,box-shadow 0.15s;}
.role-card:hover{border-color:#7F77DD;box-shadow:0 2px 8px rgba(127,119,221,0.15);}
.role-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;font-weight:600;}
.role-info{flex:1;}
.role-name{font-weight:600;font-size:14px;}
.role-desc{font-size:12px;color:#888;margin-top:2px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;border-bottom:1px solid #e5e5e5;margin-bottom:1.2rem;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.topbar-logo{width:30px;height:30px;background:#EEEDFE;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.topbar-title{font-weight:600;font-size:14px;}
.topbar-role{font-size:11px;color:#888;}
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;border:1px solid #e5e5e5;cursor:pointer;font-size:12px;}
.user-chip:hover{background:#f5f5f3;}
.user-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;}
.readonly-banner{background:#FAEEDA;border:1px solid #FAC775;border-radius:8px;padding:6px 12px;font-size:12px;color:#854F0B;margin-bottom:1rem;display:flex;align-items:center;gap:6px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
</style>
</head>
<body>
<div class="app">
  <div id="login-view"></div>
  <div id="main-view" class="hidden"></div>
  <div id="modal-root"></div>
</div>

<script>
const ROLES=[
  {id:'manager',name:'Manager / Top management',desc:'Full access — approve, reject, manage everything',color:'#EEEDFE',textColor:'#534AB7',icon:'M'},
  {id:'officer',name:'HR Officer',desc:'Upload resumes, add interview notes, update interns',color:'#E1F5EE',textColor:'#0F6E56',icon:'O'},
  {id:'viewer',name:'Read-only viewer',desc:'View all data, no changes',color:'#E6F1FB',textColor:'#185FA5',icon:'V'},
];
const DEPTS=['HR','Finance','Business Development','Operations','Marketing','ESG & PDPA'];
const VALUES=['ethics','excellence','entrepreneurship','profit','progress','possibilities'];
const SCHOOLS=['NUS','NTU','SMU','SIT','SUTD','SUSS','Other'];
const REC_STAGES=['New','AI Screened','Interview Scheduled','Pending Approval','Approved','Rejected','Onboarded'];
const STAGE_BADGE={'New':'b-new','AI Screened':'b-screened','Interview Scheduled':'b-interview','Pending Approval':'b-pending','Approved':'b-approved','Rejected':'b-rejected','Onboarded':'b-onboarded'};
const AVC=['av0','av1','av2','av3','av4'];

let currentRole=null,activeTab='dashboard',viewRec=null,viewIntern=null,recFilter='All';

function ini(n){return n.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();}
function avc(i){return AVC[i%5];}
function today(){return new Date().toISOString().slice(0,10);}
function pct(a,b){return Math.round((a/b)*100);}
function canEdit(){return currentRole==='manager'||currentRole==='officer';}
function isManager(){return currentRole==='manager';}

let db={
  candidates:[
    {id:1,name:'Sarah Chen',school:'NUS',course:'Business Admin',email:'sarah.c@email.com',phone:'9123 4567',appliedDate:'2025-04-10',stage:'Pending Approval',aiSummary:'Strong communicator with leadership experience. Active in entrepreneurship club. Consistent academic performance and relevant internship history.',aiScores:{ethics:4,excellence:4,entrepreneurship:5,profit:3,progress:4,possibilities:4},aiOverall:83,interviewNotes:[{officer:'Wei Ling',date:'2025-04-22',content:'Very confident and articulate. Strong teamwork examples.',rating:4}],officerRecommend:true,notes:[]},
    {id:2,name:'Marcus Toh',school:'NTU',course:'Psychology',email:'marcus.t@email.com',phone:'8234 5678',appliedDate:'2025-04-12',stage:'Interview Scheduled',aiSummary:'Empathetic and people-oriented. Volunteering background. Good cultural fit potential.',aiScores:{ethics:5,excellence:3,entrepreneurship:3,profit:3,progress:4,possibilities:4},aiOverall:72,interviewNotes:[],officerRecommend:false,notes:[]},
    {id:3,name:'Ling Hui Xin',school:'SMU',course:'Information Systems',email:'linghx@email.com',phone:'9345 6789',appliedDate:'2025-04-15',stage:'AI Screened',aiSummary:'Tech-savvy with strong analytical skills. Fast learner with self-directed learning outside coursework.',aiScores:{ethics:3,excellence:5,entrepreneurship:4,profit:4,progress:5,possibilities:3},aiOverall:78,interviewNotes:[],officerRecommend:false,notes:[]},
    {id:4,name:'Derrick Lau',school:'SIT',course:'Engineering',email:'derrick.l@email.com',phone:'8456 7890',appliedDate:'2025-03-18',stage:'Onboarded',aiSummary:'Methodical problem-solver. Process improvement focus. Detail-oriented.',aiScores:{ethics:4,excellence:5,entrepreneurship:3,profit:4,progress:4,possibilities:3},aiOverall:76,interviewNotes:[{officer:'Rong Jie',date:'2025-03-25',content:'Very solid. Methodical thinking, great process mindset.',rating:5}],officerRecommend:true,notes:['Started May 2025']},
  ],
  interns:[
    {id:1,name:'Derrick Lau',school:'SIT',course:'Engineering',startDate:'2025-05-01',endDate:'2025-10-31',week:4,status:'Active',currentDept:'Finance',notes:['Strong in process mapping'],values:{ethics:4,excellence:5,entrepreneurship:3,profit:4,progress:4,possibilities:3}},
    {id:2,name:'Jamie Lim',school:'NUS',course:'Business Admin',startDate:'2025-01-06',endDate:'2025-06-27',week:18,status:'Active',currentDept:'Marketing',notes:['Great communicator'],values:{ethics:4,excellence:4,entrepreneurship:3,profit:3,progress:4,possibilities:4}},
    {id:3,name:'Priya Nair',school:'NTU',course:'Psychology',startDate:'2025-01-13',endDate:'2025-07-11',week:16,status:'Active',currentDept:'Operations',notes:['Detail-oriented'],values:{ethics:5,excellence:4,entrepreneurship:4,profit:3,progress:4,possibilities:3}},
  ],
  projects:[
    {id:1,internId:2,name:'Employer Branding Audit',type:'Recurring',status:'In Progress',dueDate:'2025-05-30',progress:60,notes:'Reviewing LinkedIn and Glassdoor'},
    {id:2,internId:3,name:'HR Trends Research',type:'Recurring',status:'In Progress',dueDate:'2025-06-15',progress:40,notes:'Gamification in recruitment'},
    {id:3,internId:1,name:'Finance Process Mapping',type:'Recurring',status:'In Progress',dueDate:'2025-05-20',progress:25,notes:'Mapping AP/AR workflows'},
  ],
  evaluations:[
    {id:1,internId:2,date:'2025-03-01',type:'Midpoint',rating:4,strengths:'Communication, creativity',improvements:'Time management',recommends:true,notes:'Strong performer, good culture fit'},
  ],
  activity:[
    {text:'Sarah Chen awaiting approval',date:'2025-04-22',type:'pending'},
    {text:'Derrick Lau onboarded to internship',date:'2025-05-01',type:'approved'},
    {text:'Marcus Toh interview scheduled',date:'2025-04-20',type:'interview'},
    {text:'Employer Branding Audit — 60% complete',date:'2025-05-03',type:'project'},
  ]
};
let nid={c:5,i:4,p:4,e:2};

function renderLogin(){
  document.getElementById('login-view').innerHTML=`
    <div class="login-screen">
      <div class="login-logo">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><rect x="3" y="3" width="10" height="10" rx="2" fill="#7F77DD"/><rect x="17" y="3" width="10" height="10" rx="2" fill="#AFA9EC"/><rect x="3" y="17" width="10" height="10" rx="2" fill="#AFA9EC"/><rect x="17" y="17" width="10" height="10" rx="2" fill="#7F77DD"/></svg>
      </div>
      <div class="login-title">Future Leaders</div>
      <div class="login-sub">Elitez Group · Select your role to continue</div>
      <div class="role-cards">
        ${ROLES.map(r=>`
          <div class="role-card" onclick="login('${r.id}')">
            <div class="role-icon" style="background:${r.color};color:${r.textColor};">${r.icon}</div>
            <div class="role-info">
              <div class="role-name">${r.name}</div>
              <div class="role-desc">${r.desc}</div>
            </div>
            <span style="color:#ccc;font-size:18px;">›</span>
          </div>`).join('')}
      </div>
    </div>`;
}

function login(role){
  currentRole=role;
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('main-view').classList.remove('hidden');
  activeTab='dashboard';viewRec=null;viewIntern=null;
  renderMain();
}

function logout(){
  currentRole=null;
  document.getElementById('main-view').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('modal-root').innerHTML='';
  renderLogin();
}

function renderMain(){
  const roleInfo=ROLES.find(r=>r.id===currentRole);
  const pending=db.candidates.filter(c=>c.stage==='Pending Approval').length;
  const tabs=['dashboard','recruitment','interns','projects','evaluations'];
  const tabLabels=['Dashboard','Recruitment','Active interns','Projects','Evaluations'];
  document.getElementById('main-view').innerHTML=`
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="5" rx="1" fill="#7F77DD"/><rect x="9" y="2" width="5" height="5" rx="1" fill="#AFA9EC"/><rect x="2" y="9" width="5" height="5" rx="1" fill="#AFA9EC"/><rect x="9" y="9" width="5" height="5" rx="1" fill="#7F77DD"/></svg></div>
        <div><div class="topbar-title">Future Leaders</div><div class="topbar-role">${roleInfo.name}</div></div>
      </div>
      <div class="user-chip" onclick="logout()">
        <div class="user-av" style="background:${roleInfo.color};color:${roleInfo.textColor};">${roleInfo.icon}</div>
        <span>${roleInfo.name.split(' ')[0]}</span>
        <span style="color:#888;font-size:11px;">Sign out</span>
      </div>
    </div>
    ${currentRole==='viewer'?'<div class="readonly-banner"><span>&#9432;</span> Read-only view — you can browse all data but cannot make changes.</div>':''}
    <div class="tabs" id="tabs">
      ${tabs.map((t,i)=>`<button class="tab ${activeTab===t?'active':''}" onclick="sw('${t}')">${tabLabels[i]}${t==='recruitment'&&pending?` <span style="background:#7F77DD;color:#fff;font-size:10px;padding:1px 5px;border-radius:10px;margin-left:3px;">${pending}</span>`:''}</button>`).join('')}
    </div>
    ${tabs.map(t=>`<div id="sec-${t}" class="sec ${activeTab===t?'active':''}"></div>`).join('')}
  `;
  ['dashboard','recruitment','interns','projects','evaluations'].forEach(t=>renderSection(t));
}

function sw(t){
  activeTab=t;
  document.querySelectorAll('.tab').forEach(b=>{const m=b.getAttribute('onclick').match(/'(\w+)'/);if(m)b.classList.toggle('active',m[1]===t);});
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('sec-'+t);if(el)el.classList.add('active');
  renderSection(t);
}

function renderSection(t){
  const el=document.getElementById('sec-'+t);if(!el)return;
  if(t==='dashboard')renderDashboard(el);
  else if(t==='recruitment')renderRecruitment(el);
  else if(t==='interns')renderInterns(el);
  else if(t==='projects')renderProjects(el);
  else if(t==='evaluations')renderEvals(el);
}

function renderDashboard(el){
  const counts={};REC_STAGES.forEach(s=>counts[s]=0);db.candidates.forEach(c=>counts[c.stage]=(counts[c.stage]||0)+1);
  const pendingCands=db.candidates.filter(c=>c.stage==='Pending Approval');
  const activeInternsList=db.interns.filter(i=>i.status==='Active');
  el.innerHTML=`
  <div class="metrics">
    <div class="metric"><div class="ml">Applicants</div><div class="mv">${db.candidates.length}</div></div>
    <div class="metric"><div class="ml">Pending approval</div><div class="mv" style="color:#534AB7">${pendingCands.length}</div></div>
    <div class="metric"><div class="ml">Active interns</div><div class="mv" style="color:#3B6D11">${activeInternsList.length}</div></div>
    <div class="metric"><div class="ml">Live projects</div><div class="mv" style="color:#854F0B">${db.projects.filter(p=>p.status==='In Progress').length}</div></div>
    <div class="metric"><div class="ml">Converted</div><div class="mv" style="color:#0F6E56">${db.interns.filter(i=>i.status==='Converted').length}</div></div>
  </div>
  <div class="pipe-flow">
    ${['New','AI Screened','Interview Scheduled','Pending Approval','Approved','Onboarded'].map((s,i)=>`${i>0?'<div class="pa">›</div>':''}<div class="ps"><div class="ps-n" style="color:${['#185FA5','#854F0B','#534AB7','#7F77DD','#3B6D11','#0F6E56'][i]}">${counts[s]||0}</div><div class="ps-l">${s}</div></div>`).join('')}
  </div>
  <div class="g2" style="margin-bottom:12px;">
    <div class="card">
      <div class="section-header"><div style="font-weight:600;font-size:15px;">${isManager()?'Awaiting your approval':'Pending approvals'}</div>${pendingCands.length?`<span class="badge b-pending">${pendingCands.length} pending</span>`:''}</div>
      ${pendingCands.length?pendingCands.map((c,i)=>`<div class="row" onclick="viewRec=${c.id};sw('recruitment');"><div class="avatar ${avc(i)}">${ini(c.name)}</div><div class="ri"><div class="rn">${c.name}</div><div class="rs">${c.school} · AI: ${c.aiOverall}% · ${c.officerRecommend?'<span style="color:#3B6D11">Recommended</span>':'Awaiting notes'}</div></div></div>`).join(''):'<div style="color:#888;font-size:13px;padding:6px 0;">No pending approvals</div>'}
    </div>
    <div class="card">
      <div class="section-header"><div style="font-weight:600;font-size:15px;">Active interns</div><button class="btn btn-sm" onclick="sw(\'interns\')">View all</button></div>
      ${activeInternsList.map((intern,i)=>`<div class="row" onclick="viewIntern=${intern.id};sw('interns');"><div class="avatar ${avc(i)}">${ini(intern.name)}</div><div class="ri"><div class="rn">${intern.name}</div><div class="rs">${intern.currentDept} · Week ${intern.week}/24</div><div class="pbar"><div class="pfill" style="width:${pct(intern.week,24)}%;background:#7F77DD"></div></div></div></div>`).join('')||'<div style="color:#888;font-size:13px;">No active interns</div>'}
    </div>
  </div>
  <div class="g2">
    <div class="card">
      <div style="font-weight:600;font-size:15px;margin-bottom:10px;">Active projects</div>

function closeModal(e){if(!e||e.target.classList.contains('modal-overlay'))document.getElementById('modal-root').innerHTML='';}

function handleUpload(input){
  const file=input.files[0];if(!file)return;
  const status=document.getElementById('upload-status');
  status.innerHTML=`<div style="background:#f9f9f9;border-radius:12px;padding:1rem;text-align:center;margin-top:1rem;"><div class="spinner"></div><div style="font-size:12px;color:#888;">AI screening in progress...</div></div>`;
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const base64=e.target.result.split(',')[1];
      let msgs=[{role:'user',content:`You are an HR screening assistant for Elitez Group Singapore. Analyse this resume and return ONLY a JSON object, no preamble or markdown.\n\nFile: ${file.name}\n\nReturn:\n{"name":"full name or Unknown","school":"university","course":"course of study","email":"email or empty","phone":"phone or empty","aiSummary":"2-3 sentence fit assessment for a dynamic HR/staffing internship","aiScores":{"ethics":1-5,"excellence":1-5,"entrepreneurship":1-5,"profit":1-5,"progress":1-5,"possibilities":1-5},"aiOverall":0-100}`}];
      if(file.type==='application/pdf'||file.name.endsWith('.pdf')){
        msgs=[{role:'user',content:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},{type:'text',text:'You are an HR screening assistant for Elitez Group Singapore. Analyse this resume and return ONLY a JSON object, no preamble or markdown.\n\nReturn:\n{"name":"full name or Unknown","school":"university","course":"course of study","email":"email or empty","phone":"phone or empty","aiSummary":"2-3 sentence fit assessment for a dynamic HR/staffing internship","aiScores":{"ethics":1-5,"excellence":1-5,"entrepreneurship":1-5,"profit":1-5,"progress":1-5,"possibilities":1-5},"aiOverall":0-100}'}]}];
      }
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:msgs})});
      const data=await res.json();
      const txt=data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
      const parsed=JSON.parse(txt.replace(/```json|```/g,'').trim());
      const nc={id:nid.c++,name:parsed.name||file.name,school:parsed.school||'',course:parsed.course||'',email:parsed.email||'',phone:parsed.phone||'',appliedDate:today(),stage:'AI Screened',aiSummary:parsed.aiSummary||'Screened.',aiScores:parsed.aiScores||{ethics:3,excellence:3,entrepreneurship:3,profit:3,progress:3,possibilities:3},aiOverall:parsed.aiOverall||60,interviewNotes:[],officerRecommend:false,notes:[]};
      db.candidates.push(nc);
      db.activity.unshift({text:`${nc.name} — AI screening completed (${nc.aiOverall}% fit)`,date:today(),type:'screening'});
      status.innerHTML=`<div style="background:#EAF3DE;border:1px solid #97C459;border-radius:12px;padding:12px 14px;margin-top:1rem;"><div style="font-weight:600;color:#3B6D11;">Screened successfully</div><div style="font-size:13px;color:#27500A;">${nc.name} — ${nc.aiOverall}% fit</div><div style="margin-top:8px;"><button class="btn btn-sm btn-primary" onclick="closeModal();viewRec=${nc.id};sw('recruitment');">View profile</button></div></div>`;
      renderSection('dashboard');renderSection('recruitment');
    }catch(err){
      status.innerHTML=`<div style="background:#FCEBEB;border:1px solid #F09595;border-radius:12px;padding:12px;margin-top:1rem;"><div style="font-weight:600;color:#A32D2D;">Could not auto-screen</div><div style="font-size:12px;color:#791F1F;margin-top:3px;">Please add manually.</div></div>`;
    }
  };
  reader.readAsDataURL(file);
}

function saveManualCand(){
  const name=document.getElementById('mn').value.trim();if(!name)return;
  db.candidates.push({id:nid.c++,name,school:document.getElementById('ms').value,course:document.getElementById('mc').value,email:document.getElementById('me').value,phone:document.getElementById('mp').value,appliedDate:document.getElementById('md').value||today(),stage:'New',aiSummary:document.getElementById('mb').value||'Manually added.',aiScores:{ethics:3,excellence:3,entrepreneurship:3,profit:3,progress:3,possibilities:3},aiOverall:0,interviewNotes:[],officerRecommend:false,notes:[]});
  db.activity.unshift({text:`${name} added manually`,date:today(),type:'new'});
  closeModal();renderSection('dashboard');renderSection('recruitment');
}
function saveInterviewNote(cid){
  const c=db.candidates.find(x=>x.id===cid);if(!c)return;
  const officer=document.getElementById('no').value.trim();if(!officer)return;
  const rec=document.getElementById('nrec').checked;
  c.interviewNotes.push({officer,date:document.getElementById('nd').value,rating:parseInt(document.getElementById('nr').value)||3,content:document.getElementById('nc').value});
  c.officerRecommend=rec;
  if(rec&&['New','AI Screened','Interview Scheduled'].includes(c.stage)){c.stage='Pending Approval';db.activity.unshift({text:`${c.name} moved to Pending Approval by ${officer}`,date:today(),type:'pending'});}
  closeModal();viewRec=cid;renderMain();
}
function approveC(cid){
  const c=db.candidates.find(x=>x.id===cid);if(!c)return;
  const re=document.getElementById(`ar-${cid}`);if(re&&re.value.trim())c.notes.push('Approval: '+re.value.trim());
  c.stage='Approved';db.activity.unshift({text:`${c.name} approved`,date:today(),type:'approved'});
  viewRec=cid;renderMain();
}
function rejectC(cid){
  const c=db.candidates.find(x=>x.id===cid);if(!c)return;
  const re=document.getElementById(`ar-${cid}`);if(re&&re.value.trim())c.notes.push('Rejection: '+re.value.trim());
  c.stage='Rejected';db.activity.unshift({text:`${c.name} rejected`,date:today(),type:'rejected'});
  viewRec=null;renderMain();
}
function onboardC(cid){
  const c=db.candidates.find(x=>x.id===cid);if(c){c.stage='Onboarded';db.activity.unshift({text:`${c.name} onboarded`,date:today(),type:'approved'});}
  viewRec=null;renderMain();
}
function convertToIntern(cid){
  const c=db.candidates.find(x=>x.id===cid);if(!c)return;
  c.stage='Onboarded';
  db.interns.push({id:nid.i++,name:c.name,school:c.school,course:c.course,startDate:today(),endDate:'',week:1,status:'Active',currentDept:'HR',notes:[],values:{...c.aiScores}});
  db.activity.unshift({text:`${c.name} converted to active intern`,date:today(),type:'approved'});
  viewRec=null;sw('interns');
}
function saveIntern(){
  const name=document.getElementById('in2').value.trim();if(!name)return;
  db.interns.push({id:nid.i++,name,school:document.getElementById('isch').value,course:document.getElementById('ic').value,startDate:document.getElementById('isd').value,endDate:document.getElementById('ied').value,week:parseInt(document.getElementById('iw').value)||1,status:document.getElementById('ist').value,currentDept:document.getElementById('idpt').value,notes:[],values:{ethics:3,excellence:3,entrepreneurship:3,profit:3,progress:3,possibilities:3}});
  closeModal();renderSection('interns');
}
function updateIntern(id){
  const intern=db.interns.find(x=>x.id===id);if(!intern)return;
  intern.status=document.getElementById('ist').value;
  intern.week=parseInt(document.getElementById('iw').value)||intern.week;
  intern.currentDept=document.getElementById('idpt').value;
  closeModal();viewIntern=id;renderSection('interns');
}
function saveInternNote(id){
  const txt=document.getElementById('nt').value.trim();if(!txt)return;
  const intern=db.interns.find(x=>x.id===id);if(intern)intern.notes.push(txt);
  closeModal();viewIntern=id;renderSection('interns');
}
function saveProject(){
  const name=document.getElementById('pn').value.trim();if(!name)return;
  db.projects.push({id:nid.p++,internId:parseInt(document.getElementById('pi').value),name,type:document.getElementById('pt').value,status:document.getElementById('ps2').value,dueDate:document.getElementById('pd').value,progress:parseInt(document.getElementById('pp').value)||0,notes:document.getElementById('pnt').value});
  closeModal();renderSection('projects');renderSection('dashboard');
}
function saveEval(){
  db.evaluations.push({id:nid.e++,internId:parseInt(document.getElementById('ei').value),date:document.getElementById('ed2').value,type:document.getElementById('et').value,rating:parseInt(document.getElementById('er').value)||3,strengths:document.getElementById('es').value,improvements:document.getElementById('ei2').value,recommends:document.getElementById('erec').checked,notes:document.getElementById('en').value});
  closeModal();renderSection('evaluations');
}

renderLogin();
</script>
